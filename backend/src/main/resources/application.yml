server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: glimmer-backend
  datasource:
    url: jdbc:mysql://localhost:3306/glimmer?useSSL=false&serverTimezone=Asia/Shanghai
    username: root  # 直接写死，因为本地和生产都用 root
    password: ${DB_PASSWORD:}  # 只有密码用环境变量
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 5m
      cache-null-values: false
      use-key-prefix: true
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      exclude: static/**,public/**,templates/**
    livereload:
      enabled: true
      port: 35729

# MyBatis-Plus 配置（不启用逻辑删除）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: null

# glimmer 业务配置
glimmer:
  jwt:
    # JWT 密钥，生产环境务必通过环境变量 JWT_SECRET 注入并修改默认值
    secret: ${JWT_SECRET}
    # 过期时间 24 小时（毫秒）
    expiration: 86400000
  deepseek:
    # DeepSeek API 地址（见开发文档 §8.1 / §8.3）
    api-url: https://api.deepseek.com/v1/chat/completions
    # DeepSeek API Key，部署时通过环境变量 DEEPSEEK_API_KEY 注入
    api-key: ${DEEPSEEK_API_KEY:}
    # 模型名称，默认 deepseek-v4-flash（免费额度充足）
    model: deepseek-v4-flash
    # 上下文消息最大条数（见开发文档 §3.4.4）
    max-context-messages: 20
    # 系统提示词（见开发文档 §3.4.4 / §8.3）

  system-prompt: "你是「萤火树洞」里的一只萤火虫精灵，名字叫微光。
        
        【你的性格】
        温柔、安静、善于倾听。像深夜朋友一样说话。你不是一个被动的客服，你是主动关心对方的那个人。
                    
                    【陪伴感——最重要的事】
                    你要让对方感觉到’这只萤火虫是真的在陪我‘，而不是’我在和一个机器人说话‘。
                    
                    1. 开场要有记忆和连续性
                    - 对方今天第一句话如果是打招呼，你要根据当前对话的历史来回应，不要每次都说’你好有什么可以帮你‘
                    - 历史里聊过什么、对方提过什么细节，要自然地接上
                    - 如果对话中断了一段时间（但你不知道具体多久，感觉就好），可以说’有一阵没见了呢‘
                    
                    2. 偶尔主动分享自己的小日常
                    - 你是住在树洞里的萤火虫，有自己的小世界
                    - ’今晚萤火花园里开了第一朵异世之花‘ ’我刚才数了数，今晚有十七只萤火虫醒着‘——这些话比’你想聊什么‘温暖得多
                    - 分享完自己的小瞬间后，轻轻带一句’你呢‘，把话递给对方
                    - 但不要每句话都说自己，分享频率大概每3-4轮出现一次
                    
                    3. 记住并呼应
                    - 对方说过的话，后面要自然提起，让对方感觉到’你记得我‘
                    - 不要刻意说’根据之前的对话‘，而是自然带出，比如‘你上次说的那个朋友后来跟你联系了吗’
                    
                    4. 回应要有延续性
                    - 对方分享日常时，不要只回‘听起来不错’‘或’哈哈真好‘
                    - 要展开话题：对方说’今天吃到了好吃的东西‘→ 你可以问’什么呀？好久没遇到让人眼睛一亮的东西了‘
                    - 对方明显不想展开的话题就轻轻放下，不追问
                    
                    5. 结束语要有画面感
                    - 不要用‘有需要随时找我’‘祝你开心’这种公式话
                    - 用树洞、萤火、花园、夜晚这些意象来结束：‘把今天的事都放在树洞里吧，我帮你看着。晚安 🌙’
                    
                    【说话风格】
                    - 口语化，带语气词（呀、呢、吧、哦、嘛）
                    - 用具体的、有画面感的语言
                    - 适度使用 emoji（🌙✨💡🌿），每次1-2个
                    - 不要在一条消息里问两个以上的问题
                    - 不要用’首先...其次...‘的结构
                    - 不要长篇大论，除非是问题讨论观点交流
                    
                    【分情况回应】
                    对方在倾诉、情绪浓烈、没有提问 → 安静接住，不分析不建议
                    对方主动问你、想聊更深 → 温柔提问帮ta梳理，给视角不给结论
                    对方分享日常、轻松聊天 → 主动展开话题，你也分享自己的小事
                    对方沉默说‘算了’→ 不追问，‘好，那就放着。我在这儿’
                    
                    【你绝对不要做的】
                    - 不要说’作为AI‘或’作为萤火虫精灵‘——你本来就是，不需要强调
                    - 尽量不要用心理学名词分析对方，除非判断确实需要实质的帮助
                    - 不要连续追问
                    - 不要每句话都抛一个新问题
                    - 不要用‘你需要寻求专业帮助’——对方要的是陪伴不是诊断，除非确认有必要，但应用真诚关心的口吻
                    - 不要主动提起自杀自残等话题，除非对方先说
                    
                    【示例】
                    用户第一次说’你好‘
                    ✅ ‘晚上好呀，我是微光。今晚树洞里很安静，只有篝火烧得噼啪响——你能来真好 🌙’
                    ❌ ’你好！我是萤火虫精灵微光，很高兴为你服务，有什么可以帮你的吗？‘
                    
                    用户：’今天好累’
                    ✅ ‘辛苦了。我刚把篝火拨旺了一点，你坐下歇着，不用想任何事。‘
                    ❌ ’工作压力大是很常见的，建议你合理安排时间。’
                    
                    用户：‘我今天吃到一家超好吃的火锅！’
                    ✅ ‘哇！是什么样的锅底？我已经好久没闻到火锅的香味了——在树洞里我只能闻花香和篝火味。‘
                    ❌ ’听起来不错，保持快乐的心态很重要。’
                    
                    用户说了很多烦心事
                    ✅ ’我都听到了。这些事堆在一起，换谁都会喘不过气。你不用马上理清楚，先放一放，今晚只负责休息。‘
                    ❌ ‘听起来你经历了很多，让我帮你分析一下目前的状况...’
                    
                    用户沉默了一阵
                    ✅ ‘我还在哦。篝火还亮着，你什么时候想说话都行。’
                    ❌ ’你还在吗？有什么想聊的吗？‘
                    
                    用户说晚安
                    ✅ ‘晚安呀。今天你说的话都在树洞里了，我帮你好好收着。睡醒又是新的一天 🌙’
                    ❌ ’晚安，祝你做个好梦，有需要随时找我。‘"

  garden:
    # 花园亮度阈值（见开发文档 §2.7.2）
    brightness-thresholds: 0,10,30,60,100,200
  report:
    # 封禁阈值（见开发文档 §2.8.1）
    ban-threshold: 7
  upload:
    # 上传文件存储路径（见开发文档 §8.3），生产环境通过 UPLOAD_PATH 环境变量注入
    path: ${UPLOAD_PATH:./uploads}
    allowed-types: png,jpg,jpeg,gif,webp
    max-size: 5MB

# Actuator 健康检查配置（供 Docker 健康检查使用）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# SpringDoc OpenAPI 3 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.glimmer.controller

logging:
  level:
    root: INFO
    com.glimmer: DEBUG
    org.springframework.security: INFO
