<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="roseSeedGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5b7b1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#c0392b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#641e16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="roseSeedBody" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e6b0aa"/>
      <stop offset="30%" stop-color="#c0392b"/>
      <stop offset="70%" stop-color="#922b21"/>
      <stop offset="100%" stop-color="#641e16"/>
    </radialGradient>
    <radialGradient id="roseHighlight" cx="40%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="roseGlowF" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#roseSeedGlow)">
    <animate attributeName="r" values="26;29;26" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g filter="url(#roseGlowF)">
    <ellipse cx="32" cy="36" rx="10" ry="13" fill="url(#roseSeedBody)"/>
    <ellipse cx="32" cy="36" rx="10" ry="13" fill="url(#roseHighlight)"/>
    <ellipse cx="28" cy="28" rx="3" ry="4" fill="#fadbd8" opacity="0.5"/>
    <path d="M32 22 Q34 30 32 38 Q30 30 32 22" fill="none" stroke="#e6b0aa" stroke-width="0.8" opacity="0.4"/>
    <circle cx="32" cy="22" r="2.2" fill="#fadbd8" opacity="0.85">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="22" r="1" fill="#ffffff">
      <animate attributeName="r" values="0.6;1.2;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <ellipse cx="32" cy="56" rx="10" ry="2" fill="#641e16" opacity="0.15"/>
